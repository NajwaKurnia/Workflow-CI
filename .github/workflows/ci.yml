name: CI MLflow Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install mlflow dagshub scikit-learn pandas numpy matplotlib seaborn

      - name: Run MLflow Project
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLproject
          mlflow run . --env-manager=local -P n_estimators=100 -P max_depth=10 -P test_size=0.2

      - name: Get Run ID and Build Docker Image
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cat > get_run_id.py << 'EOF'
          import mlflow, dagshub
          dagshub.init(repo_owner='NajwaKurnia', repo_name='Ekperimen_SML_Najwa-Kurnia', mlflow=True)
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name('WineQuality_CI')
          runs = client.search_runs(exp.experiment_id, order_by=['start_time DESC'], max_results=1)
          print(runs[0].info.run_id)
          EOF
          RUN_ID=$(python3 get_run_id.py)
          echo "Run ID: $RUN_ID"
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "najwakurnia/wine-quality-model"

      - name: Push Docker Image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push najwakurnia/wine-quality-model

      - name: Save Artifacts to GitHub
        run: |
          cp MLproject/confusion_matrix.png .
          cp MLproject/feature_importance.png .
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add confusion_matrix.png feature_importance.png
          git commit -m "CI: update artifacts" || echo "No changes"
          git push