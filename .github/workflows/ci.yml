name: CI MLflow Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install mlflow dagshub scikit-learn pandas \
                      numpy matplotlib seaborn conda-lock

      - name: Run MLflow Project
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: "https://dagshub.com/NajwaKurnia/Ekperimen_SML_Najwa-Kurnia.mlflow"
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLproject
          mlflow run . --env-manager=local \
            -P n_estimators=100 \
            -P max_depth=10 \
            -P test_size=0.2

      - name: Build Docker Image
        run: |
          cd MLproject
          mlflow models build-docker \
            -m "runs:/$(mlflow runs list --experiment-name WineQuality_CI \
                --output-format json | python3 -c \
                "import sys,json; runs=json.load(sys.stdin); \
                print(runs[0]['run_id'])")/model" \
            -n "NajwaKurnia/wine-qulity-model" \
            --enable-mlserver

      - name: Push Docker Image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" --password-stdin
          docker push NajwaKurnia/wine-qulity-model

      - name: Save Artifacts to GitHub
        run: |
          cp MLproject/confusion_matrix.png .
          cp MLproject/feature_importance.png .
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add confusion_matrix.png feature_importance.png
          git commit -m "CI: update artifacts" || echo "No changes"
          git push