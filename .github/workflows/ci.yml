name: CI MLflow Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install mlflow dagshub scikit-learn pandas numpy matplotlib seaborn

      - name: Run MLflow Project
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: "https://dagshub.com/NajwaKurnia/Ekperimen_SML_Najwa-Kurnia.mlflow"
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLproject
          mlflow run . --env-manager=local -P n_estimators=100 -P max_depth=10 -P test_size=0.2

      - name: Build and Push Docker Image
        env:
          MLFLOW_TRACKING_URI: "https://dagshub.com/NajwaKurnia/Ekperimen_SML_Najwa-Kurnia.mlflow"
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          RUN_ID=$(python3 -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          exps = client.search_experiments()
          for e in exps:
              runs = client.search_runs(e.experiment_id, order_by=['start_time DESC'], max_results=1)
              if runs:
                  print(runs[0].info.run_id)
                  break
          ")
          echo "Run ID: $RUN_ID"
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "najwakurnia/wine-qulity-model"
          docker push najwakurnia/wine-qulity-model

      - name: Save Artifacts to GitHub
        run: |
          cp MLproject/confusion_matrix.png .
          cp MLproject/feature_importance.png .
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase
          git add confusion_matrix.png feature_importance.png
          git commit -m "CI: update artifacts" || echo "No changes"
          git push